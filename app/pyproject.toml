[project]
name = "idle-shutdown"
version = "0.1.0"
description = "Idle Shutdown & Session Restore — Windows utility"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "psutil>=5.9",
  "pywin32>=306; sys_platform == 'win32'",
  "pyvda>=0.4; sys_platform == 'win32'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.0",
]

[project.scripts]
idle-shutdown = "idle_shutdown.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idle_shutdown*"]

[tool.setuptools.package-data]
idle_shutdown = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true